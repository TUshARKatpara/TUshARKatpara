<svg width="520" height="500" viewBox="0 0 520 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal style profile panel for Tushar Katpara">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090f1f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: Consolas, 'Courier New', monospace; }
      .key { font: 700 15px Consolas, monospace; fill: #67e8f9; }
      .value { font: 14px Consolas, monospace; fill: #e5e7eb; }
      .muted { font: 12px Consolas, monospace; fill: #94a3b8; }
      .project { font: 13px Consolas, monospace; fill: #c4b5fd; }
    </style>
  </defs>
  <rect width="520" height="500" rx="22" fill="#050816"/>
  <rect x="12" y="12" width="496" height="476" rx="18" fill="url(#bg)" stroke="#26354f"/>
  <line x1="12" y1="58" x2="508" y2="58" stroke="#26354f"/>
  <circle cx="34" cy="35" r="5" fill="#ff5f57"/>
  <circle cx="52" cy="35" r="5" fill="#ffbd2e"/>
  <circle cx="70" cy="35" r="5" fill="#28c840"/>
  <text x="94" y="40" class="muted">whoami --verbose</text>
  <text x="34" y="84" class="mono" fill="#a78bfa" font-size="15" filter="url(#softGlow)">$ profile.scan()</text>
  
  <g opacity="0">
    <text x="38" y="92" class="key">user</text>
    <text x="152" y="92" class="value">TUshARKatpara</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.18s" dur="0.35s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="38" y="126" class="key">role</text>
    <text x="152" y="126" class="value">Data Science Student</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.35s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="38" y="160" class="key">focus</text>
    <text x="152" y="160" class="value">Machine Learning, EDA, Model Deployment</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.42s" dur="0.35s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="38" y="194" class="key">stack</text>
    <text x="152" y="194" class="value">Python, Pandas, NumPy, scikit-learn, SQL</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.54s" dur="0.35s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="38" y="228" class="key">github</text>
    <text x="152" y="228" class="value">6 visible repos, 392 tracked contributions</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.66s" dur="0.35s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="38" y="262" class="key">projects</text>
    <text x="152" y="262" class="value">Movie Rating Analysis, HR Analytics, Jarvis AI</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.78s" dur="0.35s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="38" y="296" class="key">learning</text>
    <text x="152" y="296" class="value">Deep Learning, MLOps, Power BI, GitHub</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.90s" dur="0.35s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="38" y="330" class="key">status</text>
    <text x="152" y="330" class="value">Building portfolio projects for real interviews</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.02s" dur="0.35s" fill="freeze"/>
  </g>
  <rect x="34" y="326" width="452" height="132" rx="12" fill="#07101f" stroke="#1e3a5f"/>
  <text x="48" y="350" class="key">featured repositories</text>
  
  <g opacity="0">
    <text x="48" y="366" class="project">./movie-rating-analysis</text>
    <text x="266" y="366" class="muted">rating prediction + EDA</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.15s" dur="0.35s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="48" y="390" class="project">./dA-HR-ANALYTICS-PROJECT</text>
    <text x="266" y="390" class="muted">HR analytics dashboard story</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.27s" dur="0.35s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="48" y="414" class="project">./ds-lab</text>
    <text x="266" y="414" class="muted">Python Jarvis assistant</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.39s" dur="0.35s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="48" y="438" class="project">./projects</text>
    <text x="266" y="438" class="muted">portfolio experiments</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.51s" dur="0.35s" fill="freeze"/>
  </g>
  <text x="38" y="472" class="muted">signal: practical projects, clean docs, repeatable analysis</text>
</svg>
